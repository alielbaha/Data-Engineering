version: 2

models:
  - name: fact_reviews
    description: "Fact table at review-event grain (one row per review event)"
    columns:
      - name: review_key
        tests:
          - not_null
          - unique
      - name: review_id
        tests:
          - not_null
          - unique
      - name: app_version_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_apps_scd')
                field: app_version_key
      - name: app_key
        tests:
          - not_null
      - name: developer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_developers')
                field: developer_key
      - name: category_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: category_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: rating_score
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: review_timestamp
        tests:
          - not_null
