version: 2

models:
  - name: srv_monthly_rating_trend
    description: "Monthly rating trend for BI dashboards"
    columns:
      - name: year_month
        tests:
          - not_null
          - unique
      - name: review_count
        tests:
          - not_null
      - name: avg_rating
        tests:
          - not_null

  - name: srv_developer_performance
    description: "Developer-level performance metrics for BI dashboards"
    columns:
      - name: developer_key
        tests:
          - not_null
          - unique
      - name: developer_name
        tests:
          - not_null
      - name: review_count
        tests:
          - not_null
      - name: avg_rating
        tests:
          - not_null
